<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle - SDÜ Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2416501011.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>

  <header>
    <h1>SDÜ Kampüs Etkinlikleri</h1>
    <nav>
      <ul>
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="etkinlikler.html">Etkinlikler</a></li>
        <li><a href="etkinlik-ekle.html">Ekle</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Etkinlik Ekle</h2>
    <p class="form-intro">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>
    
    <form id="etkinlik-formu" novalidate>
      <div class="form-grup">
        <label for="ad">Etkinlik Adı *</label>
        <input type="text" id="ad" name="ad">
        <span class="field-error" id="ad-hata"></span>
      </div>

      <div class="form-grup">
        <label for="kategori">Kategori *</label>
        <select id="kategori" name="kategori">
          <option value="">Seçiniz</option>
          <option value="Seminer">Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Söyleşi">Söyleşi</option>
          <option value="Yarışma">Yarışma</option>
        </select>
        <span class="field-error" id="kategori-hata"></span>
      </div>

      <div class="form-grup">
        <label for="tarih">Tarih *</label>
        <input type="date" id="tarih" name="tarih">
        <span class="field-error" id="tarih-hata"></span>
      </div>

      <div class="form-grup">
        <label for="saat">Saat *</label>
        <input type="time" id="saat" name="saat">
        <span class="field-error" id="saat-hata"></span>
      </div>

      <div class="form-grup">
        <label for="yer">Yer *</label>
        <input type="text" id="yer" name="yer">
        <span class="field-error" id="yer-hata"></span>
      </div>

      <div class="form-grup">
        <label for="kontenjan">Kontenjan</label>
        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000">
        <span class="field-error" id="kontenjan-hata"></span>
      </div>

      <div class="form-grup">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="5"></textarea>
        <span class="field-error" id="aciklama-hata"></span>
      </div>

      <button type="submit">Kaydet</button>
    </form>

    <div id="form-mesaj" hidden></div>
  </main>

  <footer>
    <p>&copy; 2026 Ömer Salih Özen - 2416501011 | Süleyman Demirel Üniversitesi</p>
  </footer>

</body>
</html>
