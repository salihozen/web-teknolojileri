<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Güncelle — Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2416501011.css">
</head>
<body>
  <header>
    <h1>Kampüs Etkinlikleri</h1>
    <nav>
      <ul>
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="etkinlikler.html">Etkinlikler</a></li>
        <li><a href="etkinlik-ekle.html">Ekle</a></li>
        <li><a href="etkinlik-guncelle.html">Güncelle</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Etkinlik Güncelle</h2>

    <form action="#" method="post">
      <div class="form-grup">
        <label for="ad">Etkinlik adı</label>
        <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026" required>
      </div>

      <div class="form-grup">
        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori" required>
          <option value="Seminer" selected>Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Söyleşi">Söyleşi</option>
        </select>
      </div>

      <div class="form-grup">
        <label for="tarih">Tarih</label>
        <input type="date" id="tarih" name="tarih" value="2026-10-12" required>
      </div>

      <div class="form-grup">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="4" required>Mezun söyleşileri ve şirket standları.</textarea>
      </div>

      <button type="submit">Güncelle</button>
    </form>
  </main>

  <footer>
    <p>Ömer Salih Özen — 2416501011</p>
  </footer>
</body>
</html>
